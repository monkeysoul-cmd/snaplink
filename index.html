<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SnapLink — Free URL shortener with click analytics, password protection, custom aliases, and QR codes. Shorten, track, and manage your links beautifully." />
    <meta name="theme-color" content="#060612" />
    <title>SnapLink - URL Shortener & Analytics</title>
    <style>
      html, body { background-color: #060612; }
      html:not(.dark), html:not(.dark) body { background-color: #f0fdf4; }
    </style>
    <script>
      try {
        if (localStorage.getItem("linkcut_theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
